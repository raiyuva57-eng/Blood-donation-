<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — LifeDrop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z" fill="#c41e3a" stroke="#c41e3a"/></svg>
      LifeDrop
    </a>
    <nav class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="community.html">Community</a>
      <a class="nav-link" href="about.html">About</a>
      <a class="nav-link" href="contact.html">Contact</a>
      <a class="nav-link" href="donor-history.html">Donor History</a>
      <a class="nav-link" href="patient.html">Patients</a>
      <a class="nav-link" href="admin.html">Admin</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <a href="login.html" class="btn btn-outline btn-sm">Sign in</a>
  </div>
</header>

<main class="wrap section" style="max-width: 480px;">
  <div class="card panel-narrow reveal">
    <div class="hero-eyebrow">Account recovery</div>
    <h1 style="font-size: 26px;">Enter your code</h1>
    <div id="tokenStatus" style="margin-bottom: 20px;"></div>

    <div id="banner"></div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label for="otpCode">6-digit code</label>
        <input type="text" id="otpCode" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
          placeholder="000000" autocomplete="one-time-code"
          class="mono" style="font-size:22px; letter-spacing:0.3em; text-align:center;">
        <div class="field-hint">Check your inbox for the code we just sent.</div>
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required placeholder="At least 8 characters" autocomplete="new-password">
        <div id="strengthMeter" style="margin-top:8px; display:none;">
          <div style="height:5px; background:var(--line); border-radius:3px; overflow:hidden;">
            <div id="strengthBar" style="height:100%; width:0%; transition: width .2s, background .2s;"></div>
          </div>
          <div id="strengthLabel" style="font-size:12.5px; margin-top:5px; font-weight:600;"></div>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required placeholder="Repeat password" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Set new password</button>
    </form>

    <p class="text-center" style="margin-top: 22px; font-size: 14px;">
      <a href="forgot-password.html" style="color: var(--crimson-deep); font-weight: 600;">Send a new code</a>
    </p>
  </div>
</main>

<footer class="footer wrap">
  <span>© 2026 LifeDrop. A community blood donation network.</span>
  <span>Built for demonstration — not for real medical use.</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/email-config.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/theme.js"></script>
<script src="js/chatbot-data.js"></script>
<script src="js/chatbot-widget.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const email = params.get('email') || '';

  const tokenStatus = document.getElementById('tokenStatus');
  const form = document.getElementById('resetForm');
  const banner = document.getElementById('banner');

  if (!email) {
    tokenStatus.innerHTML = `<div class="form-banner error">No email specified. <a href="forgot-password.html" style="font-weight:600;">Start over</a>.</div>`;
    form.style.display = 'none';
  } else {
    tokenStatus.innerHTML = `<p style="font-size:14.5px;">Enter the code sent to <strong>${escapeHtml(email)}</strong>.</p>`;
  }

  // Password strength meter, same behavior as the register form
  const pwInput = document.getElementById('newPassword');
  const meter = document.getElementById('strengthMeter');
  const bar = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  const COLORS = { 1: 'var(--crimson)', 2: 'var(--amber)', 3: 'var(--sage)' };

  pwInput.addEventListener('input', () => {
    const pw = pwInput.value;
    if (!pw) { meter.style.display = 'none'; return; }
    meter.style.display = 'block';
    const s = LifeDropAuth.checkPasswordStrength(pw);
    bar.style.width = `${(s.passed / 5) * 100}%`;
    bar.style.background = COLORS[s.level];
    label.textContent = `${s.label} password`;
    label.style.color = COLORS[s.level];
  });

  // Only allow digits in the OTP field
  const otpInput = document.getElementById('otpCode');
  otpInput.addEventListener('input', () => {
    otpInput.value = otpInput.value.replace(/[^0-9]/g, '').slice(0, 6);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const otp = otpInput.value.trim();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = form.querySelector('button[type=submit]');

    if (otp.length !== 6) {
      banner.innerHTML = `<div class="form-banner error">Enter the full 6-digit code.</div>`;
      return;
    }
    if (newPassword !== confirmPassword) {
      banner.innerHTML = `<div class="form-banner error">Passwords don't match.</div>`;
      return;
    }

    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await LifeDropAuth.completePasswordReset(email, otp, newPassword);
      banner.innerHTML = `<div class="form-banner success">Password updated. Redirecting to sign in…</div>`;
      form.style.display = 'none';
      setTimeout(() => { window.location.href = 'login.html'; }, 1200);
    } catch (err) {
      banner.innerHTML = `<div class="form-banner error">${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Set new password';
    }
  });
</script>
<script>
  const themeToggleBtn = document.getElementById('themeToggle');
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', () => LifeDropTheme.toggle());
  }
</script>
</body>
</html>
